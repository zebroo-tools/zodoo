# proxy_host: coding:8081
# Short links to switch the editor's vim mode. They used to call the toggle
# endpoint themselves behind their own copy of the gate; the gate cookie is
# scoped to /code/ now and would not be sent here. /code/?vim=1|0 does the same
# toggle after the gate (see coding.conf), so just send the browser there.
location = /codevim {
    absolute_redirect off;
    return 302 /code/?vim=1;
}
location = /novim {
    absolute_redirect off;
    return 302 /code/?vim=0;
}
