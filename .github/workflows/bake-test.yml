name: Bake test

# End-to-end smoke test for the `odoo` CLI: init -> reload -> db reset -> bake,
# plus the pgbackrest backup + point-in-time-recovery roundtrip.
# Heavy (clones full Odoo + builds Docker images). Runs:
#   - on PR when CLI source, templates or this workflow changes
#   - on demand via workflow_dispatch (with a version input)
#   - weekly so we catch upstream Odoo / image breakage

on:
  workflow_call:
    inputs:
      versions:
        description: "Comma-separated Odoo versions to bake (e.g. 17.0,19.0)"
        required: false
        default: "19.0"
        type: string
  pull_request:
    branches: [main]
    paths:
      - "zodoo/src/**"
      - "odoo/**"
      - "pgbackrest/**"
      # Die postgres-Abbilder baut dieser Test selbst - eine Aenderung dort
      # ist genau das, was gebacken gehoert. Fehlte hier, und deshalb lief
      # der Bake bei einer Aenderung an postgres/Dockerfile.* NICHT.
      - "postgres/**"
      # Gehen genauso in die Abbilder: common_snippets/zodoo baut das venv
      # jedes Containers, cronjobs stellt den Cron-Daemon der Instanz.
      - "common_snippets/**"
      - "cronjobs/**"
      - "templates/customs_template/**"
      - ".github/workflows/bake-test.yml"
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated Odoo versions to bake (e.g. 17.0,19.0)"
        required: false
        default: "19.0"
  schedule:
    # Mondays 04:00 UTC — pick up upstream breakage early in the week.
    - cron: "0 4 * * 1"

jobs:
  bake:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'zebroo-tools' }}
    timeout-minutes: 120
    env:
      ZODOO_BAKE_TEST_VERSIONS: ${{ inputs.versions || github.event.inputs.versions || '19.0' }}
    steps:
      - name: Isolate job home and tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" ]]; then
            if [[ "${ZEBROO_DOCKER_ISOLATED:-}" != "1" || -z "${DOCKER_HOST:-}" ]]; then
              echo "::error::An isolated Docker service must be configured for this runner."
              exit 1
            fi
          fi
          # Short prefix: the postgres socket lands below this home and
          # Unix socket paths are limited to 107 bytes.
          job_home=$(mktemp -d "$RUNNER_TEMP/h.XXXXXX")
          mkdir -p "$job_home/.local/bin" "$job_home/pipx" "$job_home/tmp" "$job_home/.docker"
          {
            echo "HOME=$job_home"
            echo "PIPX_HOME=$job_home/pipx"
            echo "PIPX_BIN_DIR=$job_home/.local/bin"
            echo "TMPDIR=$job_home/tmp"
            echo "DOCKER_CONFIG=$job_home/.docker"
          } >> "$GITHUB_ENV"
          echo "$job_home/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipx and gimera
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx install gimera

      - name: Configure git identity (required for odoo src init)
        run: |
          git config --global user.email "ci@zodoo.test"
          git config --global user.name "zodoo CI"
          git config --global init.defaultBranch main

      - name: Install zodoo (this checkout)
        run: |
          pipx install -e zodoo/src
          # Make pipx-installed binaries reachable for subsequent steps.
          # PIPX_BIN_DIR differs by platform (GitHub runner uses /opt/pipx_bin,
          # local install uses $HOME/.local/bin) — resolve dynamically.
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
          # zodoo CLI hardcodes config.dirs["images"] to ~/.odoo/images.
          # Mirror the checkout there so templates/customs_template/<ver>/
          # and odoo/config/<ver>/ are discoverable in the test. A symlink
          # is NOT enough — zodoo uses `find` (no -L) to scan compose files,
          # which skips symlinked trees entirely.
          mkdir -p "$HOME/.odoo/images"
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" "$HOME/.odoo/images/"

      - name: Show tool versions
        run: |
          odoo --version || true
          docker --version
          gimera --version || true
          python --version

      - name: Inject pytest into zodoo venv
        # pytest must run inside the zodoo pipx venv so it can import
        # zodoo + click + passlib + ... from the same environment. A
        # top-level `pip install pytest` would put pytest into a
        # different interpreter and fail with ModuleNotFoundError.
        # cd /tmp: newer pipx treats `zodoo` as a path when a ./zodoo/
        # directory exists in cwd, breaking the inject.
        working-directory: ${{ runner.temp }}
        run: |
          pipx inject zodoo pytest pytest-cov

      - name: Run bake test
        run: |
          ZODOO_PY="$(pipx environment --value PIPX_LOCAL_VENVS)/zodoo/bin/python"
          "$ZODOO_PY" -m pytest -vv -s -m slow zodoo/src/zodoo/tests/test_bake.py

      - name: Run write-only filestore end-to-end test
        # Proves the point of that path: the second run uploads nothing and the
        # third uploads exactly the one file added in between. That is a
        # property of the ledger surviving between container runs, so only a
        # live stack can show it. Reuses the docker layers built above.
        run: |
          ZODOO_PY="$(pipx environment --value PIPX_LOCAL_VENVS)/zodoo/bin/python"
          "$ZODOO_PY" -m pytest -vv -s -m slow \
            zodoo/src/zodoo/tests/test_offsite_filestore_e2e.py

      - name: Run pgbackrest PITR end-to-end test
        # Brings up the optional pgbackrest service, takes a backup + WAL,
        # then recovers to a named restore point and asserts the change was
        # undone. Reuses the 19.0 docker layers built by the bake step.
        run: |
          ZODOO_PY="$(pipx environment --value PIPX_LOCAL_VENVS)/zodoo/bin/python"
          "$ZODOO_PY" -m pytest -vv -s -m slow zodoo/src/zodoo/tests/test_lib_pgbackrest.py

      - name: Run pgbackrest repo-host end-to-end test
        # The other pgbackrest test uses a local repository. This one brings up
        # a real `pgbackrest server` as the receiving side - in the project's
        # OWN image, so the two ends cannot differ in version - and asserts
        # that full, diff and incr all arrive over TLS with a client
        # certificate. Reuses the docker layers built above.
        run: |
          ZODOO_PY="$(pipx environment --value PIPX_LOCAL_VENVS)/zodoo/bin/python"
          "$ZODOO_PY" -m pytest -vv -s -m slow \
            zodoo/src/zodoo/tests/test_pgbackrest_repo_host_e2e.py

      - name: Collect docker logs on failure
        if: failure()
        run: |
          mkdir -p ${{ runner.temp }}/bake-logs
          docker ps -a > ${{ runner.temp }}/bake-logs/docker-ps.txt 2>&1 || true
          docker images > ${{ runner.temp }}/bake-logs/docker-images.txt 2>&1 || true
          for c in $(docker ps -aq); do
            docker logs "$c" > "${{ runner.temp }}/bake-logs/container-${c}.log" 2>&1 || true
          done
          ls -la "$HOME/.odoo/log" 2>/dev/null || true
          cp -r "$HOME/.odoo/log" ${{ runner.temp }}/bake-logs/odoo-log 2>/dev/null || true

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bake-test-logs
          path: ${{ runner.temp }}/bake-logs
          if-no-files-found: ignore
