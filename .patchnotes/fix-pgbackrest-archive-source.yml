type: fix
description: 'postgres/pgbackrest images: keep the pinned pgBackRest version installable. apt.postgresql.org dropped 2.59.1 (our PGBR_VERSION pin), so every postgres build failed with "Version ''2.59.1-*'' for ''pgbackrest'' was not found". When PGBR_VERSION is set, apt-archive.postgresql.org is now added as an extra source (low pin priority, same signing key), so the pinned version still installs. The pin itself is unchanged - all hosts of a repository keep the same version.'
breaking: false
