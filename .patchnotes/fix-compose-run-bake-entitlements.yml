type: fix
description: "Restoring a dump (e.g. on new CICD branches) no longer fails with 'additional privileges requested: pass --allow=fs.read=…'. With docker compose >= 5 the implicit image build during `docker compose run` goes through buildx bake; zodoo now sets BUILDX_BAKE_ENTITLEMENTS_FS=0 for every compose call, not only for `odoo build`."
breaking: false
