type: feature
description: "CI „Prebuild generic images“: Jedes Image wird vor dem Upload in die zodoo-Registry mit Trivy (feste Version, Prüfsumme) auf CVEs geprüft. Die Job-Summary zeigt je Image CRITICAL/HIGH/MEDIUM mit Anzahl behebbarer Befunde, die vollen Berichte liegen als Artefakt „trivy-reports“ am Lauf. Befunde lassen den Lauf nicht scheitern; scheitert der Scan selbst, wird nichts hochgeladen. Für Testläufe gibt es beim manuellen Start die Eingaben services, push und force_scan_failure (Doku: docs/090-registry.md)."
breaking: false
