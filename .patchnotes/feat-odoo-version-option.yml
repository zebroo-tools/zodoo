type: feature
breaking: false
description: |
  `odoo --version` gibt die zodoo-Version aus und endet mit Exit-Code 0.
  Die Option lädt kein Projekt und funktioniert deshalb in jedem
  Verzeichnis, auch per `ssh host 'odoo --version'` im Home-Verzeichnis.
  Die Version kommt aus derselben Quelle wie bei `odoo version`.
