type: fix
description: |
  Restore mit Neutralisierung bricht ab, statt eine nicht neutralisierte Kopie zu hinterlassen.
  `odoo restore odoo-db --neutralize` ohne DEVMODE und `odoo dev-env neutralize` brechen
  bei Odoo < 16 (kein `odoo-bin neutralize`) jetzt mit Fehler ab; bisher gab es nur eine
  gelbe Warnung und der Restore galt als erfolgreich. Gleiches, wenn die Datenbank kein
  Odoo enthält. Mit DEVMODE bleibt es bei der Warnung, dort deckt turndb2dev.sql Odoo < 16 ab.
  Beim Restore einer zodoo_bin-Datei liegt die Datenbank sofort unter ihrem endgültigen
  Namen; schlägt die Neutralisierung fehl, wird sie in `<db>_not_neutralized` umbenannt.
  Prüfen: Odoo-15-Projekt ohne DEVMODE, `odoo -f restore odoo-db --neutralize <dump>` →
  roter Abbruch „is NOT neutralized“.
breaking: false
