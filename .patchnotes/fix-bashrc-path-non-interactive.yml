type: fix
breaking: false
description: |
  `ssh host 'odoo ...'` findet die odoo-CLI jetzt ohne vorheriges
  `export PATH=...`.

  `pipx ensurepath` haengt seine PATH-Zeile ans Ende der `~/.bashrc`, hinter
  den Ubuntu-Block "If not running interactively, don't do anything". Bei
  einem Befehl per ssh lief die Zeile deshalb nie. install.sh,
  `odoo setup reinstall` und `odoo setup upgrade` schreiben jetzt einen markierten
  Block (`# >>> zodoo PATH >>>`) an den Anfang der `~/.bashrc` (nur Linux,
  idempotent). Von Hand: `~/.local/bin/odoo setup ensure-path`.

  Zum Pruefen: auf einem Host `odoo setup upgrade` ausfuehren, dann vom eigenen
  Rechner `ssh <host> 'odoo --version'` - es muss die Version kommen, kein
  "command not found". Ein zweiter Lauf aendert die `~/.bashrc` nicht mehr.
