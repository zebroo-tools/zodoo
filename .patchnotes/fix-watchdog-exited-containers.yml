type: fix
description: 'Container watchdog (cronjobs, restart_unhealthy_containers.sh): a failed ''docker restart'' ("tried to kill container, but did not receive an exit event") can leave a container exited with 137, which the watchdog treated like a manual ''docker kill'' and ignored - the CICD app then stayed down for days while the log said "All containers look fine". After a failed restart the watchdog now checks the container and starts it again with ''docker start''; if that fails too it leaves a marker and keeps retrying on every tick until the container runs. Manually stopped/killed containers are still left alone.'
breaking: false
