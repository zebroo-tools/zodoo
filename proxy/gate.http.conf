# http{}-level part of the access gate for /system/ and /code/
# (proxy/lua/dashauth.lua + gatecore.lua). Separate file so the gate's
# integration test (zodoo/src/zodoo/tests/test_dashauth.py) loads exactly
# what production loads.

# Server-side gate sessions (id -> user, way in, start, credential
# fingerprint) and the ids of tickets already used. ~150 bytes per entry, so
# 1m holds a few thousand sessions. Lost on proxy restart: everybody signs in
# again (one click in zCloud).
lua_shared_dict gate_sessions 1m;
lua_shared_dict gate_jti 1m;

# Brute-force throttle for the gate's entry endpoints (<area>/__auth and
# <area>/__sso): 10 per minute, burst 5, keyed by client address. Done inside
# the gate (resty.limit.req) and not with limit_req: limit_req runs in the
# preaccess phase, the gate answers in the rewrite phase before it -- a wrong
# password got its 401 before limit_req was ever asked, so the old
# limit_req_zone never throttled anything. Behind the router every request
# comes from the router's address, so this is in effect one shared budget.
lua_shared_dict gate_limit 1m;
