# proxy_host: grafana:3000
# Access gate (proxy/lua/dashauth.lua): zCloud opens the dashboard with a
# short-lived signed ticket POSTed to /system/__sso (key GATE_SSO_KEY_SYSTEM);
# a direct visit gets the password page (DASHBOARD_PASSWORD, POST to
# /system/__auth). Both lead to a server-side session (cookie
# zodoo_gate_system, Path=/system/); /system/__logout ends it. Grafana itself
# stays anonymous behind the gate. No password and no key: open in DEVMODE,
# 503 elsewhere.
# NOTE: password and ticket travel in the POST body, so terminate TLS in front
# of this proxy on internet-facing deployments (GATE_COOKIE_SECURE then marks
# the cookie Secure even though this proxy only sees http).
# Grafana is configured with GF_SERVER_SERVE_FROM_SUB_PATH=true and
# root_url .../system/ , so the /system prefix is kept (NOT stripped) and
# forwarded as-is to Grafana.

# Friendly entry points (kiosk = no Grafana chrome, just the dashboard):
#   /system -> full instance overview
#   /logs   -> log-focused view (replaces the old log.io UI)
# absolute_redirect off keeps the Location header relative so the browser
# preserves the original host:port (the proxy only knows its internal :80).
location = /system  { absolute_redirect off; return 302 /system/d/zodoo-overview/zodoo-instance-overview?kiosk; }
location = /system/ { absolute_redirect off; return 302 /system/d/zodoo-overview/zodoo-instance-overview?kiosk; }
# /logs is a searchable log explorer -> no kiosk, so the search/filter bar shows.
location = /logs    { absolute_redirect off; return 302 /system/d/zodoo-logs/zodoo-logs; }
location = /logs/   { absolute_redirect off; return 302 /system/d/zodoo-logs/zodoo-logs; }
# /logs2 used to open Grafana Explore. Explore is Editor-only since Grafana 11
# and the search on /logs covers it, so old bookmarks just land on /logs.
location = /logs2   { absolute_redirect off; return 302 /logs; }

# Trailing slash on purpose: a bare "location /system" is a prefix match and
# also grabbed Odoo/website URLs like /systemregal-... (they hit the password
# gate instead of the shop). Everything Grafana serves lives below /system/ ;
# /system itself is the exact-match redirect above.
location /system/ {
    set $backend $default_target;
    # Grafana's own pages/API (constant 30s auto-refresh) would otherwise fill
    # the access log; the request metrics are meant for the Odoo app, not the
    # dashboard. Skip access logging here entirely.
    access_log off;
    # Access gate (rewrite phase runs before the access phase below, so
    # an unauthenticated request never reaches Grafana).
    rewrite_by_lua_block {
        require("dashauth").gate(os.getenv("DASHBOARD_PASSWORD"))
    }
    access_by_lua_file "{lua_resolve_host}";

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_pass $backend;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    proxy_read_timeout 86400s; # keep Grafana Live (websocket) connections open
    error_page 502 503 504 = @fallback;
}
